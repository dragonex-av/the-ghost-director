version: '3.8'

services:
  ghost-director-mcp:
    build:
      context: ./mcp-server-alexa
      dockerfile: Dockerfile
    container_name: ghost-director-mcp
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_ID=anthropic.claude-3-5-sonnet-20241022-v2:0
    restart: unless-stopped

  ghost-director-firetv:
    build:
      context: ./fire-tv-app
      dockerfile: Dockerfile
    container_name: ghost-director-firetv
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MCP_PORT=3001
    depends_on:
      - ghost-director-mcp
    restart: unless-stopped
